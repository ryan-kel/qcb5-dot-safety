name: Refresh Data & Regenerate Outputs

on:
  workflow_dispatch:
    # Run by hand monthly or when data changes (Actions → Refresh Data, or
    # gh workflow run refresh-data.yml). Scheduled automation retired
    # 2026-10-10 at the owner's direction.

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Check source freshness
        id: freshness
        run: |
          set -uo pipefail
          SENTINEL="data_raw/.rows_updated_at"
          # Datasets the analysis actually consumes: signal studies, SRTS (speed bumps),
          # crashes (drives crash-proximity maps/charts), and APS-installed (APS chart).
          VIEWS="w76s-c5u4 9n6h-pt9g h9gi-nx95 de3m-c5p4"

          # Fail-open: any error fetching/parsing metadata -> proceed with refresh.
          max=""
          for v in $VIEWS; do
            body="$(curl -sfL --max-time 30 "https://data.cityofnewyork.us/api/views/${v}.json")" || {
              echo "WARN: metadata fetch failed for ${v}; proceeding with refresh (fail-open)."
              echo "skip=false" >> "$GITHUB_OUTPUT"
              exit 0
            }
            ru="$(printf '%s' "$body" | jq -r '.rowsUpdatedAt')" || ru=""
            case "$ru" in
              ''|*[!0-9]*)
                echo "WARN: invalid rowsUpdatedAt for ${v} (got '${ru}'); proceeding with refresh (fail-open)."
                echo "skip=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
            echo "INFO: ${v} rowsUpdatedAt=${ru}"
            if [ -z "$max" ] || [ "$ru" -gt "$max" ]; then
              max="$ru"
            fi
          done

          echo "INFO: max rowsUpdatedAt across sources = ${max}"

          prev=""
          if [ -f "$SENTINEL" ]; then
            prev="$(tr -dc '0-9' < "$SENTINEL")"
          fi
          echo "INFO: previous sentinel = '${prev}'"

          if [ -n "$prev" ] && [ "$max" = "$prev" ]; then
            echo "INFO: sources unchanged since last run; skipping refresh."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "INFO: sources changed (or no prior sentinel); proceeding with refresh."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            # Record the new max so it is committed with the other outputs.
            echo "$max" > "$SENTINEL"
          fi

      - name: Install dependencies
        if: steps.freshness.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Fetch fresh data from NYC Open Data
        if: steps.freshness.outputs.skip != 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Fetch attempt ${attempt}/5"
            if python scripts_fetch_data.py; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Fresh data fetch failed after ${attempt} attempts."
              exit 1
            fi
            sleep 120
          done

      - name: Generate charts (Part 1)
        if: steps.freshness.outputs.skip != 'true'
        run: python generate_charts.py

      - name: Generate maps & analysis (Part 2)
        if: steps.freshness.outputs.skip != 'true'
        run: python generate_maps.py

      - name: Commit updated outputs
        if: steps.freshness.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ data_raw/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated data refresh $(date +%Y-%m-%d)"
            git push
            # Dispatch the site rebuild from here. notify-site.yml listens for pushes to
            # output/**, but GitHub never runs workflows for pushes made with the default
            # GITHUB_TOKEN (loop prevention), so this job's own push is invisible to it.
            # On 2026-09-01 the refresh succeeded and the site kept serving the Aug 26 map.
            curl -sfL -X POST \
              -H "Authorization: token ${{ secrets.SITE_DEPLOY_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/ryan-kel/electoralanalytics-site/dispatches \
              -d '{"event_type": "project-updated"}' \
              && echo "Site rebuild dispatched" \
              || { echo "::error::Site rebuild dispatch failed; the site will keep serving the previous map."; exit 1; }
          fi
